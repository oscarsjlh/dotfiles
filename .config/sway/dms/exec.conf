# Startup programs (migrated from Hyprland exec-once)
exec_always ~/.local/bin/sway-session-init
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec easyeffects --gapplication-service
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# Noctalia Shell (replaces waybar, wpaperd, swaylock, wofi, notification daemon)
exec noctalia 
