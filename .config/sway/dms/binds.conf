# Noctalia IPC
set $ipc qs -c noctalia-shell ipc call

# Modifier
set $mod Mod4

# Terminal
bindsym $mod+Return exec ghostty

# Window management
bindsym $mod+W kill
bindsym $mod+V floating toggle
bindsym $mod+F fullscreen toggle
bindsym $mod+J layout toggle split

# Applications
bindsym $mod+B exec firefox
bindsym $mod+E exec pcmanfm
bindsym $mod+Space exec fuzzel 
bindsym $mod+D exec urlsel

# Screenshot
bindsym $mod+S exec grim -g "$(slurp)" - | swappy -f -

# Lock screen (Noctalia)
bindsym $mod+L exec $ipc lockScreen toggle

# Clipboard
bindsym $mod+C exec cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Noctalia shell
bindsym $mod+Shift+S exec $ipc controlCenter toggle
bindsym $mod+comma exec $ipc settings toggle

# Focus movement
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

# Workspace switching
bindsym $mod+1 workspace 1
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace 9
bindsym $mod+0 workspace 10

# Move container to workspace
bindsym $mod+Shift+1 move container to workspace 1
bindsym $mod+Shift+2 move container to workspace 2
bindsym $mod+Shift+3 move container to workspace 3
bindsym $mod+Shift+4 move container to workspace 4
bindsym $mod+Shift+5 move container to workspace 5
bindsym $mod+Shift+6 move container to workspace 6
bindsym $mod+Shift+7 move container to workspace 7
bindsym $mod+Shift+8 move container to workspace 8
bindsym $mod+Shift+9 move container to workspace 9
bindsym $mod+Shift+0 move container to workspace 10

# Scroll through workspaces

# Media keys (noctalia handles OSD)
bindsym --locked XF86AudioRaiseVolume exec $ipc volume increase
bindsym --locked XF86AudioLowerVolume exec $ipc volume decrease
bindsym --locked XF86AudioMute exec $ipc volume muteOutput
bindsym --locked XF86AudioMicMute exec $ipc volume muteInput

bindsym --locked XF86MonBrightnessUp exec $ipc brightness increase
bindsym --locked XF86MonBrightnessDown exec $ipc brightness decrease

# Media player controls (unchanged from Hyprland)
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioStop exec playerctl stop
bindsym XF86AudioPrev exec playerctl previous
bindsym XF86AudioNext exec playerctl next

# Reload and exit
bindsym $mod+Shift+C reload
bindsym $mod+Shift+E exec swaynag -t warning -m "Exit Sway?" -b "Yes" "swaymsg exit"
