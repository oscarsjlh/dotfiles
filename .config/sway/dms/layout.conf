# Output configuration
output eDP-1 {
    mode 2256x1504
    position 0 0
    scale 1
}

# Input configuration
input type:keyboard {
    xkb_layout us
}

input type:touchpad {
    natural_scroll disabled
}

input type:mouse {
    natural_scroll disabled
}

# Gaps and borders
set $gap_inner 2
set $gap_outer 4
gaps inner $gap_inner
gaps outer $gap_outer
default_border pixel 2

# Focus and layout
set $mod Mod4
focus_follows_mouse yes
floating_modifier $mod normal

# Catppuccin Mocha client colors
# border  background  text  indicator  child_border
client.focused          #89b4fa #1e1e2e #cdd6f4 #89b4fa #313244
client.focused_inactive #585b70 #1e1e2e #cdd6f4 #585b70 #313244
client.unfocused        #585b70 #1e1e2e #cdd6f4 #585b70 #313244
client.urgent           #f38ba8 #1e1e2e #cdd6f4 #f38ba8 #313244
client.placeholder      #585b70 #1e1e2e #cdd6f4 #585b70 #313244
client.background       #1e1e2e
